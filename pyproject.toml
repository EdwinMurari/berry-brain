[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "berry-brain"
version = "0.3.1"
description = "Private project memory and evidence-based lesson reuse across AI clients"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["pydantic==2.13.5"]

[project.scripts]
berry-brain = "berry_brain.client:main"
berry-brain-configure = "berry_brain.configure:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["berry_brain*"]

[project.urls]
Repository = "https://github.com/EdwinMurari/berry-brain"
Issues = "https://github.com/EdwinMurari/berry-brain/issues"
