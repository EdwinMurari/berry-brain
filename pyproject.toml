[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "berry-brain"
version = "0.1.0"
description = "Private project memory and evidence-based lesson reuse across AI clients"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["pydantic==2.13.5"]

[project.scripts]
berry-brain = "brain_client:main"
berry-brain-configure = "configure_client:cli"

[tool.setuptools]
py-modules = ["brain", "brain_client", "brain_local", "configure_client"]
